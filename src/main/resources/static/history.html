<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Historial Clinico — MediPlus</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,600;0,700;1,300;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .tab-hist { padding:8px 16px; border:none; border-radius:9px; font-family:'Plus Jakarta Sans',sans-serif; font-size:12px; font-weight:600; cursor:pointer; transition:all 0.2s; background:transparent; color:var(--text-muted); }
    .tab-hist.active { background:white; color:var(--purple); box-shadow:var(--shadow-sm); }
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">

<div class="page-hero">
  <img src="https://images.unsplash.com/photo-1538108149393-fbbd81895907?w=1400&q=80"
    alt="Historial" style="object-position: center top;">
  <div class="page-hero-overlay">
    <div class="page-hero-text">
      <h2>Historial Clinico Completo</h2>
      <p>Toda la informacion medica centralizada en un solo lugar</p>
    </div>
  </div>
</div>
    <div class="page-header">
      <h1>Historial Clinico</h1>
      <p>Vista unificada de enfermedades, citas, cirugias, terapias y medicamentos</p>
    </div>

    <div class="stats-grid mb-6">
      <div class="stat-card sc-1"><div class="stat-number" id="hDiseases">—</div><div class="stat-label">Enfermedades</div></div>
      <div class="stat-card sc-2"><div class="stat-number" id="hAppointments">—</div><div class="stat-label">Citas</div></div>
      <div class="stat-card sc-3"><div class="stat-number" id="hSurgeries">—</div><div class="stat-label">Cirugias</div></div>
      <div class="stat-card sc-4"><div class="stat-number" id="hMeds">—</div><div class="stat-label">Medicamentos</div></div>
    </div>

    <div style="display:flex;gap:4px;background:var(--border);border-radius:12px;padding:4px;margin-bottom:20px;width:fit-content;flex-wrap:wrap;">
      <button class="tab-hist active" onclick="showSection('diseases')"     id="t1">Enfermedades</button>
      <button class="tab-hist"        onclick="showSection('appointments')"  id="t2">Citas</button>
      <button class="tab-hist"        onclick="showSection('surgeries')"     id="t3">Cirugias</button>
      <button class="tab-hist"        onclick="showSection('rehabs')"        id="t4">Terapias</button>
      <button class="tab-hist"        onclick="showSection('medications')"   id="t5">Medicamentos</button>
    </div>

    <div id="secDiseases"     class="card"><div id="listDiseases"><div style="text-align:center;padding:30px;"><div class="spinner"></div></div></div></div>
    <div id="secAppointments" class="card" style="display:none;"><div id="listAppointments"><div style="text-align:center;padding:30px;"><div class="spinner"></div></div></div></div>
    <div id="secSurgeries"    class="card" style="display:none;"><div id="listSurgeries"><div style="text-align:center;padding:30px;"><div class="spinner"></div></div></div></div>
    <div id="secRehabs"       class="card" style="display:none;"><div id="listRehabs"><div style="text-align:center;padding:30px;"><div class="spinner"></div></div></div></div>
    <div id="secMedications"  class="card" style="display:none;"><div id="listMedications"><div style="text-align:center;padding:30px;"><div class="spinner"></div></div></div></div>

  </main>
</div>

<div id="toast" class="toast"></div>
<script src="js/app.js"></script>
<script>
if (!requireAuth()) throw new Error('No auth');
  document.getElementById('sidebar').innerHTML = renderSidebar('history');

  const tabs    = ['diseases','appointments','surgeries','rehabs','medications'];
  const secIds  = ['secDiseases','secAppointments','secSurgeries','secRehabs','secMedications'];
  const statusC = {Pendiente:'badge-yellow',Confirmada:'badge-teal',Completada:'badge-green',Cancelada:'badge-red'};
  const progC   = {Iniciado:'badge-teal','En progreso':'badge-yellow',Completado:'badge-green',Suspendido:'badge-red'};

  function showSection(sec) {
    tabs.forEach((t,i) => {
      document.getElementById(secIds[i]).style.display = t===sec ? 'block' : 'none';
      document.getElementById(`t${i+1}`).classList.toggle('active', t===sec);
    });
  }

  function avatar(name) {
    return `<div style="width:28px;height:28px;border-radius:50%;background:var(--grad-brand);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;color:white;flex-shrink:0;">${name ? name.split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase() : '?'}</div>`;
  }

  function emptyState(msg) {
    return `<div class="empty-state"><h3>${msg}</h3></div>`;
  }

  async function loadAll() {
    try {
      const [d, a, s, r, m] = await Promise.all([
        authFetch(`${API}/diseases`).then(x=>x.json()),
        authFetch(`${API}/appointments`).then(x=>x.json()),
        authFetch(`${API}/surgeries`).then(x=>x.json()),
        authFetch(`${API}/rehabilitations`).then(x=>x.json()),
        authFetch(`${API}/medications`).then(x=>x.json()),
      ]);

      document.getElementById('hDiseases').textContent     = d.length;
      document.getElementById('hAppointments').textContent = a.length;
      document.getElementById('hSurgeries').textContent    = s.length;
      document.getElementById('hMeds').textContent         = m.length;

      // DISEASES
      document.getElementById('listDiseases').innerHTML = !d.length ? emptyState('Sin enfermedades') :
        `<div class="table-wrap"><table>
          <thead><tr><th>#</th><th>Enfermedad</th><th>Paciente</th></tr></thead>
          <tbody>${d.map(x=>`<tr><td>#${x.id}</td><td>${x.diseaseName}</td>
            <td><div style="display:flex;align-items:center;gap:8px;">${avatar(x.user?.name)}${x.user?.name||'—'}</div></td></tr>`).join('')}
          </tbody></table></div>`;

      // APPOINTMENTS
      document.getElementById('listAppointments').innerHTML = !a.length ? emptyState('Sin citas') :
        `<div class="table-wrap"><table>
          <thead><tr><th>#</th><th>Motivo</th><th>Fecha</th><th>Estado</th><th>Paciente</th></tr></thead>
          <tbody>${a.map(x=>`<tr><td>#${x.id}</td><td>${x.reason||'—'}</td>
            <td><span style="background:var(--teal-soft);color:#2a9aaa;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:600;">${x.appointmentDate||'—'}</span></td>
            <td><span class="badge ${statusC[x.status]||'badge-purple'}">${x.status||'—'}</span></td>
            <td><div style="display:flex;align-items:center;gap:8px;">${avatar(x.user?.name)}${x.user?.name||'—'}</div></td></tr>`).join('')}
          </tbody></table></div>`;

      // SURGERIES
      document.getElementById('listSurgeries').innerHTML = !s.length ? emptyState('Sin cirugias') :
        `<div class="table-wrap"><table>
          <thead><tr><th>#</th><th>Tipo</th><th>Fecha</th><th>Notas</th><th>Paciente</th></tr></thead>
          <tbody>${s.map(x=>`<tr><td>#${x.id}</td><td>${x.surgeryType||'—'}</td>
            <td><span style="background:var(--teal-soft);color:#2a9aaa;border-radius:8px;padding:3px 9px;font-size:12px;font-weight:600;">${x.surgeryDate||'—'}</span></td>
            <td style="font-size:12px;color:var(--text-muted);">${x.notes||'—'}</td>
            <td><div style="display:flex;align-items:center;gap:8px;">${avatar(x.user?.name)}${x.user?.name||'—'}</div></td></tr>`).join('')}
          </tbody></table></div>`;

      // REHABS
      document.getElementById('listRehabs').innerHTML = !r.length ? emptyState('Sin terapias') :
        `<div class="table-wrap"><table>
          <thead><tr><th>#</th><th>Terapia</th><th>Inicio</th><th>Fin</th><th>Progreso</th><th>Paciente</th></tr></thead>
          <tbody>${r.map(x=>`<tr><td>#${x.id}</td><td>${x.therapyType||'—'}</td>
            <td style="font-size:12px;">${x.startDate||'—'}</td>
            <td style="font-size:12px;">${x.endDate||'—'}</td>
            <td><span class="badge ${progC[x.progress]||'badge-purple'}">${x.progress||'—'}</span></td>
            <td><div style="display:flex;align-items:center;gap:8px;">${avatar(x.user?.name)}${x.user?.name||'—'}</div></td></tr>`).join('')}
          </tbody></table></div>`;

      // MEDICATIONS
      document.getElementById('listMedications').innerHTML = !m.length ? emptyState('Sin medicamentos') :
        `<div class="table-wrap"><table>
          <thead><tr><th>#</th><th>Medicamento</th><th>Dosis</th><th>Frecuencia</th><th>Inicio</th><th>Fin</th><th>Paciente</th></tr></thead>
          <tbody>${m.map(x=>`<tr><td>#${x.id}</td>
            <td><div style="display:flex;align-items:center;gap:8px;">
              <div style="width:28px;height:28px;border-radius:8px;background:var(--purple-soft);display:flex;align-items:center;justify-content:center;font-size:13px;">&#128138;</div>
              ${x.medicationName||'—'}</div></td>
            <td><span class="badge badge-purple">${x.dosage||'—'}</span></td>
            <td><span class="badge badge-teal">${x.frequency||'—'}</span></td>
            <td style="font-size:12px;">${x.startDate||'—'}</td>
            <td style="font-size:12px;">${x.endDate||'—'}</td>
            <td><div style="display:flex;align-items:center;gap:8px;">${avatar(x.user?.name)}${x.user?.name||'—'}</div></td></tr>`).join('')}
          </tbody></table></div>`;

    } catch {
      showToast('Error al cargar historial', 'error');
    }
  }

  loadAll();
</script>
</body>
</html>
