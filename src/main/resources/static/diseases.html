<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enfermedades — MediPlus</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="page-header flex items-center justify-between">
      <div>
        <h1>💊 Enfermedades</h1>
        <p>Registro de enfermedades por paciente</p>
      </div>
      <button class="btn btn-primary" onclick="openModal()">+ Nueva Enfermedad</button>
    </div>

    <div class="card">
      <div id="tableContainer">
        <div style="text-align:center;padding:40px;">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">💊 Nueva Enfermedad</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="form-group">
      <label class="form-label">Nombre de la enfermedad</label>
      <input type="text" class="form-input" id="fDisease" placeholder="Ej: Diabetes tipo 2">
    </div>
    <div class="form-group">
      <label class="form-label">ID del Paciente</label>
      <select class="form-input" id="fUserId">
        <option value="">Selecciona un paciente...</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="btn btn-primary w-full" onclick="saveDisease()">Guardar</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/app.js"></script>
<script>
  localStorage.removeItem('mp_token');
if (!requireAuth()) throw new Error('No auth');
  document.getElementById('sidebar').innerHTML = renderSidebar('diseases');

  async function loadDiseases() {
    try {
      const res      = await authFetch(`${API}/diseases`);
      const diseases = await res.json();

      if (!diseases.length) {
        document.getElementById('tableContainer').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">💊</div>
            <h3>Sin enfermedades registradas</h3>
            <p>Agrega la primera con el botón "Nueva Enfermedad"</p>
          </div>`;
        return;
      }

      document.getElementById('tableContainer').innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Enfermedad</th>
                <th>Paciente</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              ${diseases.map(d => `
                <tr>
                  <td>#${d.id}</td>
                  <td>${d.diseaseName}</td>
                  <td>${d.user ? d.user.name : '—'}</td>
                  <td>
                    <button class="btn btn-danger btn-sm" onclick="deleteDisease(${d.id})">🗑 Eliminar</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>`;
    } catch {
      showToast('Error al cargar enfermedades', 'error');
    }
  }

  async function loadPatients() {
    try {
      const res   = await authFetch(`${API}/users`);
      const users = await res.json();
      const sel   = document.getElementById('fUserId');
      sel.innerHTML = '<option value="">Selecciona un paciente...</option>';
      users.forEach(u => {
        const opt   = document.createElement('option');
        opt.value   = u.id;
        opt.textContent = `${u.name} (ID: ${u.id})`;
        sel.appendChild(opt);
      });
    } catch {
      showToast('Error al cargar pacientes', 'error');
    }
  }

  function openModal() {
    document.getElementById('fDisease').value = '';
    document.getElementById('fUserId').value  = '';
    loadPatients();
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
  }

  async function saveDisease() {
    const diseaseName = document.getElementById('fDisease').value.trim();
    const userId      = document.getElementById('fUserId').value;

    if (!diseaseName || !userId) return showToast('Completa todos los campos', 'error');

    try {
      const res = await authFetch(`${API}/diseases`, {
        method: 'POST',
        body: JSON.stringify({
          diseaseName,
          user: { id: parseInt(userId) }
        })
      });
      if (!res.ok) throw new Error('Error al guardar');
      showToast('Enfermedad guardada correctamente');
      closeModal();
      loadDiseases();
    } catch(e) {
      showToast(e.message, 'error');
    }
  }

  async function deleteDisease(id) {
    if (!confirm('¿Eliminar esta enfermedad?')) return;
    try {
      await authFetch(`${API}/diseases/${id}`, { method: 'DELETE' });
      showToast('Enfermedad eliminada');
      loadDiseases();
    } catch {
      showToast('Error al eliminar', 'error');
    }
  }

  loadDiseases();
</script>
</body>
</html>
