<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cirugías — MediPlus</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="page-header flex items-center justify-between">
      <div>
        <h1>🔬 Cirugías</h1>
        <p>Registro de cirugías por paciente</p>
      </div>
      <button class="btn btn-primary" onclick="openModal()">+ Nueva Cirugía</button>
    </div>

    <div class="card">
      <div id="tableContainer">
        <div style="text-align:center;padding:40px;">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">🔬 Nueva Cirugía</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="form-group">
      <label class="form-label">Tipo de cirugía</label>
      <input type="text" class="form-input" id="fType" placeholder="Ej: Apendicectomía, Rodilla...">
    </div>
    <div class="form-group">
      <label class="form-label">Fecha de cirugía</label>
      <input type="date" class="form-input" id="fDate">
    </div>
    <div class="form-group">
      <label class="form-label">Notas</label>
      <input type="text" class="form-input" id="fNotes" placeholder="Observaciones adicionales...">
    </div>
    <div class="form-group">
      <label class="form-label">Paciente</label>
      <select class="form-input" id="fUserId">
        <option value="">Selecciona un paciente...</option>
      </select>
    </div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="btn btn-primary w-full" onclick="saveSurgery()">Guardar</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/app.js"></script>
<script>
if (!requireAuth()) throw new Error('No auth');
  document.getElementById('sidebar').innerHTML = renderSidebar('surgery');

  async function loadSurgeries() {
    try {
      const res       = await authFetch(`${API}/surgeries`);
      const surgeries = await res.json();

      if (!surgeries.length) {
        document.getElementById('tableContainer').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔬</div>
            <h3>Sin cirugías registradas</h3>
            <p>Agrega la primera con el botón "Nueva Cirugía"</p>
          </div>`;
        return;
      }

      document.getElementById('tableContainer').innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Tipo</th>
                <th>Fecha</th>
                <th>Notas</th>
                <th>Paciente</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              ${surgeries.map(s => `
                <tr>
                  <td>#${s.id}</td>
                  <td>${s.surgeryType || '—'}</td>
                  <td>${s.surgeryDate || '—'}</td>
                  <td>${s.notes || '—'}</td>
                  <td>${s.user ? s.user.name : '—'}</td>
                  <td>
                    <button class="btn btn-danger btn-sm" onclick="deleteSurgery(${s.id})">🗑 Eliminar</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>`;
    } catch {
      showToast('Error al cargar cirugías', 'error');
    }
  }

  async function loadPatients() {
    try {
      const res   = await authFetch(`${API}/users`);
      const users = await res.json();
      const sel   = document.getElementById('fUserId');
      sel.innerHTML = '<option value="">Selecciona un paciente...</option>';
      users.forEach(u => {
        const opt       = document.createElement('option');
        opt.value       = u.id;
        opt.textContent = `${u.name} (ID: ${u.id})`;
        sel.appendChild(opt);
      });
    } catch {
      showToast('Error al cargar pacientes', 'error');
    }
  }

  function openModal() {
    document.getElementById('fType').value   = '';
    document.getElementById('fDate').value   = '';
    document.getElementById('fNotes').value  = '';
    document.getElementById('fUserId').value = '';
    loadPatients();
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
  }

  async function saveSurgery() {
    const surgeryType = document.getElementById('fType').value.trim();
    const surgeryDate = document.getElementById('fDate').value;
    const notes       = document.getElementById('fNotes').value.trim();
    const userId      = document.getElementById('fUserId').value;

    if (!surgeryType || !surgeryDate || !userId) return showToast('Completa todos los campos obligatorios', 'error');

    try {
      const res = await authFetch(`${API}/surgeries`, {
        method: 'POST',
        body: JSON.stringify({
          surgeryType,
          surgeryDate,
          notes,
          user: { id: parseInt(userId) }
        })
      });
      if (!res.ok) throw new Error('Error al guardar');
      showToast('Cirugía guardada correctamente');
      closeModal();
      loadSurgeries();
    } catch(e) {
      showToast(e.message, 'error');
    }
  }

  async function deleteSurgery(id) {
    if (!confirm('¿Eliminar esta cirugía?')) return;
    try {
      await authFetch(`${API}/surgeries/${id}`, { method: 'DELETE' });
      showToast('Cirugía eliminada');
      loadSurgeries();
    } catch {
      showToast('Error al eliminar', 'error');
    }
  }

  loadSurgeries();
</script>
</body>
</html>
