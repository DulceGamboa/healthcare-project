<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacientes — MediPlus</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <div class="page-header flex items-center justify-between">
      <div>
        <h1>👤 Pacientes</h1>
        <p>Gestión completa de pacientes registrados</p>
      </div>
      <button class="btn btn-primary" onclick="openModal()">+ Nuevo Paciente</button>
    </div>

    <div class="card">
      <div id="tableContainer">
        <div style="text-align:center;padding:40px;">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">👤 Nuevo Paciente</span>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="form-group">
      <label class="form-label">Nombre completo</label>
      <input type="text" class="form-input" id="fName" placeholder="María García">
    </div>
    <div class="form-group">
      <label class="form-label">Correo electrónico</label>
      <input type="email" class="form-input" id="fEmail" placeholder="maria@correo.com">
    </div>
    <div class="form-group">
      <label class="form-label">Edad</label>
      <input type="number" class="form-input" id="fAge" placeholder="30" min="0" max="120">
    </div>
    <div style="display:flex;gap:10px;margin-top:8px;">
      <button class="btn btn-primary w-full" onclick="saveUser()">Guardar</button>
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="js/app.js"></script>
<script>
  if (!requireAuth()) throw new Error('No auth');
  document.getElementById('sidebar').innerHTML = renderSidebar('profile');

  async function loadUsers() {
    try {
      const res   = await authFetch(`${API}/users`);
      const users = await res.json();

      if (!users.length) {
        document.getElementById('tableContainer').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">👤</div>
            <h3>Sin pacientes</h3>
            <p>Agrega el primer paciente con el botón "Nuevo Paciente"</p>
          </div>`;
        return;
      }

      document.getElementById('tableContainer').innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Edad</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              ${users.map(u => `
                <tr>
                  <td>#${u.id}</td>
                  <td>${u.name}</td>
                  <td>${u.email}</td>
                  <td>${u.age} años</td>
                  <td>
                    <button class="btn btn-danger btn-sm" onclick="deleteUser(${u.id})">🗑 Eliminar</button>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>`;
    } catch {
      showToast('Error al cargar pacientes. ¿El servidor está corriendo?', 'error');
    }
  }

  function openModal() {
    document.getElementById('fName').value  = '';
    document.getElementById('fEmail').value = '';
    document.getElementById('fAge').value   = '';
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');
  }

  async function saveUser() {
    const name  = document.getElementById('fName').value.trim();
    const email = document.getElementById('fEmail').value.trim();
    const age   = document.getElementById('fAge').value;

    if (!name || !email || !age) return showToast('Completa todos los campos', 'error');

    try {
      const res = await authFetch(`${API}/users`, {
        method: 'POST',
        body: JSON.stringify({ name, email, age: parseInt(age) })
      });
      if (!res.ok) {
        const err = await res.json();
        throw new Error(err.message || 'Error al guardar');
      }
      showToast('Paciente guardado correctamente');
      closeModal();
      loadUsers();
    } catch(e) {
      showToast(e.message, 'error');
    }
  }

  async function deleteUser(id) {
    if (!confirm('¿Eliminar este paciente?')) return;
    try {
      await authFetch(`${API}/users/${id}`, { method: 'DELETE' });
      showToast('Paciente eliminado');
      loadUsers();
    } catch {
      showToast('Error al eliminar', 'error');
    }
  }

  loadUsers();
</script>
</body>
</html>
